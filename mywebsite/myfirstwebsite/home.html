<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right, #43e97b, #38f9d7);
            text-align: center;
        }

        .home-box {
            width: 400px;
            margin: 120px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        .home-box h1 {
            color: #333;
        }

        .home-box p {
            color: #555;
            font-size: 18px;
        }

        .home-box button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #ff4b5c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .home-box button:hover {
            background: #d63031;
        }
    </style>
</head>
<body>

    <div class="home-box">
        <h1>Welcome 🎉</h1>
        <p>You have successfully logged in.</p>
        <button onclick="logout()">Logout</button>
    </div>

    <script>
        function logout() {
            alert("Logged out successfully!");
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
