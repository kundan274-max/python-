<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <style>
        body{
            margin:0;
            padding:0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right,#4fac4f,#00f2fe);
        }
        .login-box{
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
         box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .login-box h2{
            margin-bottom: 20px;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .login-box button{
            width: 100%;
            padding: 10px;
            background: #4fac4f;
            color: white;
            border : none;
            border-radius: 5px;
            cursor: pointer;
        }
        .login-box button:hover{
            background: #007bff;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>login</h2>
        <form>
            <input type="text"placeholder="username" required>
            <input type="password"
            placeholder="password"required>
            <button type="submit">login</button>
        </form>
    </div>
</body>
</html>
