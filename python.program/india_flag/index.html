<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>India Flag Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="pole"></div>
    <div class="flag" id="flag" title="Click to pause/play">
      <div class="band saffron"></div>
      <div class="band white">
        <svg class="chakra" viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="0" cy="0" r="18" fill="none" stroke="#054187" stroke-width="2"/>
          <!-- 24 spokes -->
          <g stroke="#054187" stroke-width="1.4" stroke-linecap="round">
            <g transform="rotate(0)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(15)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(30)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(45)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(60)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(75)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(90)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(105)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(120)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(135)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(150)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(165)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(180)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(195)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(210)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(225)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(240)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(255)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(270)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(285)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(300)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(315)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(330)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
            <g transform="rotate(345)"><line x1="0" y1="-2" x2="0" y2="-18"/></g>
          </g>
        </svg>
      </div>
      <div class="band green"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
